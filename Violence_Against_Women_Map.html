<title>Violence Against Women Map</title>

<style>
/* Layout: a core node with four narrative hubs around it, the examples on an elliptical ring, strands colored by the narrative they reach.
   Choosing a narrative lifts its hub to the top, pulls its examples (and the ones that connect to it) into one row of cards, and docks everything else along the bottom. */
:root{
  --bg:#ffffff;
  --ink:#1b1a24;
  --muted:#6a6977;
  --line:#e3e2ea;
  --wash:#f6f6f9;
  --c1:#c9304b; --c1-ink:#a3243b;  /* red - women exist to be abused */
  --c2:#ff6b35; --c2-ink:#cc5529;  /* orange - men are the human baseline */
  --c3:#ff69b4; --c3-ink:#cc5490;  /* pink - women are responsible for their own safety */
  --c4:#9b59b6; --c4-ink:#7c4791;  /* purple - abusers are responsible for not abusing */
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 36px;
}
.t-abused{--c:var(--c1);--ci:var(--c1-ink)}
.t-baseline{--c:var(--c2);--ci:var(--c2-ink)}
.t-safety{--c:var(--c3);--ci:var(--c3-ink)}
.t-counter{--c:var(--c4);--ci:var(--c4-ink)}

.wrap{max-width:1240px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-block:4px 18px}
.eyebrow{margin:0 0 10px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:400 clamp(36px,5.4vw,58px)/.98 var(--display);letter-spacing:-.012em;text-wrap:balance}
.meta{margin:0;display:flex;flex-wrap:wrap;gap:4px 18px;font:400 12px/1.4 var(--mono);color:var(--muted)}
.meta a{color:var(--ink);text-underline-offset:3px}

.controls{display:flex;flex-wrap:wrap;gap:8px;padding-block:2px 12px}
.tbtn.all{--c:var(--ink);--ci:var(--ink)}
.tbtn{
  display:inline-flex;align-items:center;gap:9px;min-height:40px;padding:8px 15px;
  border:1.5px solid color-mix(in srgb,var(--c) 50%,#fff);border-radius:999px;background:#fff;color:var(--ink);
  font:500 13px/1.25 var(--body);text-align:left;cursor:pointer;
  transition:background-color .2s,border-color .2s,box-shadow .2s;
}
.tbtn .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.tbtn .n{font:500 11px/1 var(--mono);color:var(--muted)}
.tbtn:hover{background:color-mix(in srgb,var(--c) 7%,#fff)}
.tbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);box-shadow:inset 0 0 0 1px var(--c)}
.tbtn.all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:none}
.tbtn.all[aria-pressed="true"] .n{color:#c9c8d4}
.tbtn:focus-visible,.pchip:focus-visible,.p-close:focus-visible,.disc:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.status{margin:0 0 12px;min-height:1.5em;font:400 13.5px/1.5 var(--body);color:var(--muted)}

.stage{
  position:relative;height:680px;overflow:hidden;background:#fff;
  border-block:1px solid var(--line);
  transition:height .8s var(--ease);touch-action:pan-y;
}
.edges{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.edge{fill:none;stroke:var(--c);stroke-linecap:round;stroke-width:1.3;stroke-opacity:.5;transition:stroke-opacity .4s,stroke-width .4s}
.edge.cross{stroke-opacity:.4}
.edge.core{stroke:#d6d5e0;stroke-opacity:1;stroke-width:1}
.edges[data-hl] .edge:not(.core){stroke-opacity:.09}
.edges[data-hl] .edge.on{stroke-opacity:.95;stroke-width:2.1}

.node{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity}
.node .disc{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  width:var(--w);height:var(--h);margin:0;padding:0;overflow:hidden;
  appearance:none;font:inherit;color:inherit;background:#fff;cursor:pointer;
  transition:width .8s var(--ease),height .8s var(--ease),border-radius .8s var(--ease),padding .8s var(--ease),background-color .4s,border-color .4s,transform .2s;
}
.label{
  position:absolute;left:0;top:calc(var(--h) / 2 + 9px);width:var(--lw);transform:translateX(-50%);
  text-align:center;pointer-events:none;
  transition:top .8s var(--ease),width .8s var(--ease),opacity .35s;
}
.label b{display:block;font:500 12.5px/1.25 var(--body);color:var(--ink);text-wrap:balance;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff}
.label .tag{display:block;margin-top:4px;font:500 10px/1.25 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ci);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff}
.label .tag:empty{display:none}

/* core */
.center .disc{border:1px solid var(--line);background:var(--wash);border-radius:50%;display:grid;place-items:center;cursor:default}
.center .disc span{font:400 13px/1.05 var(--display);text-align:center;color:var(--ink);padding:0 8px;transition:opacity .3s}
.center.dot .disc span{opacity:0}

/* hubs */
.hub .disc{border:2px solid var(--c);border-radius:50%;display:grid;place-items:center}
.hub .disc:hover{background:color-mix(in srgb,var(--c) 8%,#fff)}
.hub .htext{display:block;padding:0 8px;font:400 14.5px/1.05 var(--display);color:var(--ink);text-wrap:balance;transition:font-size .6s var(--ease),opacity .3s}
.stage.narrow .hub .htext{font-size:11.5px;padding:0 5px}
.hub.active .disc{background:color-mix(in srgb,var(--c) 10%,#fff);border-width:3px;cursor:default}
.hub.active .htext{font-size:18px}
.stage.narrow .hub.active .htext{font-size:14px}
.hub .label{opacity:0}
.hub.mini .disc{background:var(--c);border-width:0}
.hub.mini .htext{font-size:0;opacity:0}
.hub.mini .label{opacity:1;pointer-events:auto;cursor:pointer}
.hub.mini .label b{font-weight:500;font-size:12px}

/* items */
.item .disc img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.item.ring .disc,.item.dock .disc{border:2px solid var(--c);border-radius:50%;padding:3px}
.item.ring .disc:hover{transform:translate(-50%,-50%) scale(1.09)}
.item.card .disc{border:2px solid var(--c);border-radius:6px;padding:0}
.item.card .disc img{border-radius:4px}
.item.todo .disc{border-style:dashed}
.item .ini{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--ci);font:400 22px/1 var(--display)}
.item .ph{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit}
.item .ph .dot{width:34%;height:34%;border-radius:50%;background:var(--c);opacity:.85}
.item .ph .phtxt{display:none;font:500 10.5px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ci);text-align:center;padding:0 8px}
.item.card .ph .dot{display:none}
.item.card .ph .phtxt{display:block}
.item.card.todo .disc{background:color-mix(in srgb,var(--c) 7%,#fff)}
.item.dock .disc{background:var(--c);padding:0;border-width:2px}
.item.dock.todo .disc{background:#fff}
.item.dock .disc img,.item.dock .ini,.item.dock .ph .dot{display:none}
.item.dock .label{opacity:0}
.stage.narrow .item.ring .label{opacity:0}

.stage.snap *{transition:none!important}
@media (prefers-reduced-motion:reduce){
  .stage,.stage *,.panel,.tbtn{transition:none!important}
}

/* detail panel */
.panel{
  position:fixed;z-index:30;top:0;right:0;bottom:0;width:min(450px,100%);
  background:#fff;border-left:1px solid var(--line);box-shadow:-20px 0 44px -28px rgba(27,26,36,.35);
  padding-top:max(22px,env(safe-area-inset-top,0px));
  padding-bottom:max(28px,env(safe-area-inset-bottom,0px));
  padding-left:26px;padding-right:max(26px,env(safe-area-inset-right,0px));
  overflow-y:auto;overscroll-behavior:contain;
  visibility:hidden;transform:translateX(104%);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s;
}
.panel.open{visibility:visible;transform:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.p-close{position:absolute;top:14px;right:max(14px,env(safe-area-inset-right,0px));width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font:400 22px/1 var(--body);cursor:pointer}
.p-close:hover{background:var(--wash)}
.p-label{margin:0 0 6px;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.pchip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid color-mix(in srgb,var(--c) 45%,#fff);border-radius:999px;
  background:color-mix(in srgb,var(--c) 9%,#fff);color:var(--ci);font:500 12px/1.3 var(--body);text-align:left;cursor:pointer;
}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.pchip.primary{background:color-mix(in srgb,var(--c) 18%,#fff);border-color:var(--c)}
.pchip:hover{background:color-mix(in srgb,var(--c) 22%,#fff)}
.panel h2{margin:20px 56px 8px 0;font:400 36px/1.02 var(--display);letter-spacing:-.005em;text-wrap:balance}
.who{margin:0 0 4px;font:400 11.5px/1.4 var(--mono);color:var(--muted)}
.figs{display:grid;gap:16px;margin:18px 0}
.figs figure{margin:0}
.figs img{display:block;width:100%;height:auto;max-height:440px;object-fit:contain;background:var(--wash);border:1px solid var(--line);border-radius:4px}
.figs figcaption{margin-top:6px;font:400 12px/1.5 var(--body);color:var(--muted)}
.ptext p{margin:0 0 13px;font-size:14.5px;line-height:1.62;max-width:64ch}
.todo-box{margin:16px 0;padding:16px;border:1.5px dashed color-mix(in srgb,var(--c) 60%,#fff);border-radius:6px;color:var(--muted);font-size:13.5px}
.todo-box strong{display:block;margin-bottom:2px;color:var(--ink);font-weight:600}
.note{margin:16px 0;padding:12px 14px;background:var(--wash);border-radius:6px;font-size:13.5px}
.src{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.src ul{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.src li{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.src a{color:var(--ink);text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--ink) 35%,#fff)}
.src a:hover{text-decoration-color:var(--ink)}

@media (max-width:720px){
  .panel{
    top:auto;left:0;right:0;width:auto;max-height:84vh;
    border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    box-shadow:0 -20px 44px -28px rgba(27,26,36,.4);
    padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
    transform:translateY(104%);
  }
  .panel.open{transform:none}
  .panel h2{font-size:30px}
  .tbtn{flex:1 1 100%}
}
</style>

   text:[

     'While feminist movements of the 20th century increased women\'s freedom to dress for self-expression and to feel beautiful, they did not eliminate social expectations. Across cultures, women bear the responsibility of concealing themselves to not provoke unwanted attention, while simultaneously adhering to society\'s beauty standards to gain social respect and value. Religious modesty, such as veils used in monotheistic religions, and dress codes in school and workplaces setting, exemplify how cultural norms disproportionately target women\'s appearances to "reduce distraction" and make women less provocative. These dress codes reinforce gender stereotypes and place the responsibility on women to manage others perceptions to gain respect and social acceptance.',

  {id:'cornell', theme:'counter', title:'Cornell University Rape Case & Jane Doe Anonymity', short:'Cornell & Jane Doe',

   text:[
     '"Jane Doe" has become the standard legal pseudonym to anonymize female victims in legal proceedings. The Cornell University rape case, that occurred in October 2024, sparked a solidarity movement #IAmJaneDoe when the rape victim\'s identity was leaked. In October 2026, Doe\'s family faced a swatting incident due to false information given to law enforcement intended to trigger an armed police response in their home (Picheta, 2026). These incidents highlight the safety risks rape victims face when speaking up and pressing charges.',

/* ---------- layout ---------- */

var extraH = m.a.length ? 18 + aRows * ch + (aRows - 1) * gap : 0;
var totalRowsH = rowsH + extraH;

var need = hubY + hubR + 40 + totalRowsH + 28 + dockH;
H = Math.max(baseHeight(), need);

var dockTop = H - dockH;
var rowTop = hubY + hubR + Math.max(
  26,
  (dockTop - (hubY + hubR) - totalRowsH) / 2
);

rowMid = rowTop + totalRowsH / 2;

  T.c = {x:cx, y:hubY, o:0, cls:'dot', w:10, h:10, lw:0, z:1};
  T['h:' + mode] = {x:cx, y:hubY, o:1, cls:'active', w:2*hubR, h:2*hubR, lw:140, z:8};

  m.p.forEach(function(it, idx){
    var r = Math.floor(idx / perRow), c = idx % perRow;
    var k = r < rows - 1 ? perRow : n - perRow * (rows - 1);
    var total = k * cw + (k - 1) * gap;
    T[it.id] = {x:cx - total / 2 + cw / 2 + c * (cw + gap), y:rowTop + r * (ch + gap) + imgH / 2, o:1, cls:'card', w:cw, h:imgH, lw:cw, z:6, cross:false};
  });

var aRow = rowTop + rows * (ch + gap) + 18;
m.a.forEach(function(it, idx){
  var r = Math.floor(idx / perRow), c = idx % perRow;
  var k = Math.min(perRow, m.a.length - r * perRow);
  var total = k * cw + (k - 1) * gap;
  T[it.id] = {
    x:cx - total / 2 + cw / 2 + c * (cw + gap),
    y:aRow + r * (ch + gap) + imgH / 2,
    o:1, cls:'card', w:cw, h:imgH, lw:cw, z:6, cross:true
  };
});

  var others = THEMES.filter(function(t){ return t.id !== mode; });
  var span = narrow ? W * 0.31 : Math.min(W * 0.28, 340);
  var hubSize = narrow ? 24 : 28;
  var inRow = {}; m.all.forEach(function(it){ inRow[it.id] = 1; });
  others.forEach(function(t, i){
    var hx = cx + (i - 1) * span;
    T['h:' + t.id] = {x:hx, y:H - (narrow ? 74 : 62), o:1, cls:'mini', w:hubSize, h:hubSize, lw:Math.min(150, span - 10), z:4};
    var rest = ITEMS.filter(function(it){ return it.theme === t.id && !inRow[it.id]; });
    var step = narrow ? 18 : 22;
    rest.forEach(function(it, j){
      T[it.id] = {x:hx + (j - (rest.length - 1) / 2) * step, y:H - (narrow ? 130 : 118), o:1, cls:'dock', w:14, h:14, lw:0, z:3};
    });
  });
  return T;
}

/* ---------- animation ---------- */
var raf = 0;
function tick(now){
  var act = false;
  for(var i = 0; i < list.length; i++){
    var n = list[i];
    var k = n.dur ? (now - n.t0) / n.dur : 1;
    if(k < 0) k = 0;
    if(k >= 1) k = 1; else act = true;
    var e = ease(k);
    n.cur.x = n.from.x + (n.to.x - n.from.x) * e;
    n.cur.y = n.from.y + (n.to.y - n.from.y) * e;
    n.cur.o = n.from.o + (n.to.o - n.from.o) * e;
    n.el.style.transform = 'translate3d(' + n.cur.x.toFixed(2) + 'px,' + n.cur.y.toFixed(2) + 'px,0)';
    n.el.style.opacity = n.cur.o.toFixed(3);
    n.el.style.visibility = n.cur.o < 0.02 ? 'hidden' : 'visible';
  }
  drawEdges();
  raf = act ? requestAnimationFrame(tick) : 0;
}

function go(mode, instant){
  state.theme = mode;
  var T = layout(mode);
  stage.classList.toggle('narrow', narrow);
  if(instant) stage.classList.add('snap');
  stage.style.height = H + 'px';
  var now = performance.now(), dur = (instant || reduce) ? 0 : 820;

  list.forEach(function(n, i){
    var t = T[n.id];
    n.el.className = n.base + ' ' + t.cls + (t.cross ? ' cross' : '');
    n.el.style.setProperty('--w', t.w + 'px');
    n.el.style.setProperty('--h', t.h + 'px');
    n.el.style.setProperty('--lw', (t.lw || 0) + 'px');
    n.el.style.zIndex = t.z;
    if(n.tag){
      var parts = [];
      if(t.cls === 'card'){
        if(t.cross) parts.push('Also connects here');
        if(n.item.todo) parts.push('Text to come');
      }
      n.tag.textContent = parts.join(' · ');
    }
    n.from = dur ? {x:n.cur.x, y:n.cur.y, o:n.cur.o} : {x:t.x, y:t.y, o:t.o};
    n.to = {x:t.x, y:t.y, o:t.o};
    n.dur = dur;
    n.t0 = now + (dur ? (i % 7) * 18 : 0);
  });

  if(raf) cancelAnimationFrame(raf);
  tick(now + 1);
  if(instant) requestAnimationFrame(function(){ requestAnimationFrame(function(){ stage.classList.remove('snap'); }); });

  btns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.theme === mode)); });
  if(mode === 'all'){
    statusEl.textContent = ITEMS.length + ' examples across ' + THEMES.length + ' narratives. Choose a narrative to line its examples up in a row, or tap any example to read it.';
  } else {
    var mm = members(mode);
    statusEl.textContent = THEME[mode].name + ': ' + plural(mm.p.length, 'example') + ' belong here and ' + mm.a.length + ' more ' + (mm.a.length === 1 ? 'connects' : 'connect') + ' to it.';
  }
  refreshEdges();
}

/* ---------- detail panel ---------- */
var lastFocus = null;
function chip(tid, primary){
  return '<button type="button" class="pchip ' + THEME[tid].cls + (primary ? ' primary' : '') + '" data-theme="' + tid + '"><i></i>' + esc(THEME[tid].short) + '</button>';
}
function panelHTML(it){
  var t = THEME[it.theme];
  var h = '<button class="p-close" type="button" aria-label="Close details">×</button>';
  h += '<p class="p-label">Belongs to</p><div class="chips">' + chip(it.theme, true) + '</div>';
  if(it.also.length) h += '<p class="p-label">Also connects to</p><div class="chips">' + it.also.map(function(a){ return chip(a, false); }).join('') + '</div>';
  h += '<h2>' + esc(it.title) + '</h2>';
  if(it.imgs && it.imgs.length){
    h += '<div class="figs">' + it.imgs.map(function(im){
      return '<figure><img src="' + IMG[im.k] + '" alt="' + esc(im.alt || '') + '" loading="lazy">' + (im.cap ? '<figcaption>' + esc(im.cap) + '</figcaption>' : '') + '</figure>';
    }).join('') + '</div>';
  }
  if(it.text) h += '<div class="ptext">' + it.text.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
  else h += '<div class="todo-box ' + t.cls + '"><strong>' + (it.imgs ? 'Analysis to come' : 'Text and image to come') + '</strong>' + (it.who ? esc(it.who) + ' is adding this one.' : 'Not written yet.') + '</div>';
  if(it.src && it.src.length){
    h += '<div class="src"><p class="p-label">Sources</p><ul>' + it.src.map(function(s){
      return '<li>' + (s.u ? '<a href="' + esc(s.u) + '" target="_blank" rel="noopener">' + esc(s.t) + '</a>' : esc(s.t)) + '</li>';
    }).join('') + '</ul></div>';
  }
  return h;
}
function openItem(id, from){
  lastFocus = from || null;
  panel.innerHTML = panelHTML(ITEM[id]);
  panel.scrollTop = 0;
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  var c = panel.querySelector('.p-close'); if(c) c.focus({preventScroll:true});
}
function closePanel(){
  if(!panel.classList.contains('open')) return;
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  if(lastFocus && document.body.contains(lastFocus)) lastFocus.focus({preventScroll:true});
  lastFocus = null;
}
panel.addEventListener('click', function(e){
  var c = e.target.closest('.p-close');
  if(c){ closePanel(); return; }
  var ch = e.target.closest('.pchip');
  if(ch){ lastFocus = null; closePanel(); go(ch.dataset.theme); }
});
stage.addEventListener('click', function(e){
  if(!e.target.closest('.disc') && !e.target.closest('.hub')) closePanel();
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closePanel(); });

/* ---------- start + resize ---------- */
W = stage.clientWidth; narrow = W < 720;
go('all', true);

var rt = 0;
function onResize(){
  var w = stage.clientWidth;
  if(!w || w === W) return;
  clearTimeout(rt);
  rt = setTimeout(function(){ W = stage.clientWidth; narrow = W < 720; go(state.theme, true); }, 60);
}
if('ResizeObserver' in window) new ResizeObserver(onResize).observe(stage);
else window.addEventListener('resize', onResize);
})();
</script>
